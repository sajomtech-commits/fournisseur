name: Collecte quotidienne

on:
  schedule:
    # Tous les jours à 06:00 UTC (08:00 heure de Paris en été)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # permet aussi un lancement manuel depuis GitHub

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collecter les nouveautés
        run: node scripts/collect.mjs

      - name: Publier si les données ont changé
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Aucun changement — rien à publier."
          else
            git commit -m "Données du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
